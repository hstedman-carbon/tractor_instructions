<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATK quick start</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E9EDE8; --ink:#1C2A24; --muted:#5B6A62; --line:#C9D1CB;
  --btn:#1C2A24; --btn-ink:#FFFFFF; --btn2:#FFFFFF; --btn2-ink:#1C2A24;
  --signal:#F2C21B;
  --go:#1F7A45; --auto:#0E7486; --stop:#B3302C;
  --card-edge:transparent;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#141C18; --ink:#EEF2EE; --muted:#A3B0A8; --line:#34423B;
    --btn:#EEF2EE; --btn-ink:#141C18; --btn2:#1F2A25; --btn2-ink:#EEF2EE;
    --go:#2A9457; --auto:#138A9E; --stop:#C63E39; --card-edge:#34423B;
  }
}
:root[data-theme="dark"]{
  --page:#141C18; --ink:#EEF2EE; --muted:#A3B0A8; --line:#34423B;
  --btn:#EEF2EE; --btn-ink:#141C18; --btn2:#1F2A25; --btn2-ink:#EEF2EE;
  --go:#2A9457; --auto:#138A9E; --stop:#C63E39; --card-edge:#34423B;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--page);color:var(--ink)}
.app{min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:10px 16px 16px}
header{display:flex;align-items:center;gap:10px;min-height:52px}
.back{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 8px 0 2px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:700 17px/1 "Poppins",system-ui,sans-serif;cursor:pointer}
.back svg{width:22px;height:22px}
.back[disabled]{opacity:.3;cursor:default}
.title{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 15px/1.1 "Poppins",system-ui,sans-serif;letter-spacing:.01em}
.lang{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;height:40px}
.lang button{border:0;background:transparent;color:var(--ink);font:700 15px/1 "Poppins",system-ui,sans-serif;padding:0 11px;cursor:pointer;min-width:44px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.screen{flex:1;display:flex;flex-direction:column;padding-top:8px}
.figure{position:relative;background:#fff;border-radius:14px;border:1px solid var(--card-edge);overflow:hidden;aspect-ratio:1200/646}
.figure img{display:block;width:100%;height:100%;object-fit:contain}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;min-height:40px}
.stepno{font:700 15px/1 "Poppins",system-ui,sans-serif;color:var(--muted);padding-left:4px}
.figure{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:10;background:#fff;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);cursor:zoom-out}
.zoom img{width:100%;height:100%;object-fit:contain}
.zoom span{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);font:700 15px/1 "Poppins",system-ui,sans-serif;color:#1C2A24;background:#E9EDE8;padding:10px 12px;border-radius:8px}
.prompt{margin:20px 2px 0;font:700 clamp(20px,5.4vw,25px)/1.3 "Poppins",system-ui,sans-serif;text-wrap:pretty}
/* Decisions are square-cornered like the flowchart's rectangles; actions are pill-shaped like its ovals. */
.decision .prompt{border-left:5px solid var(--signal);padding-left:12px}
.spacer{flex:1;min-height:20px}
.actions{display:grid;gap:12px}
.actions.two{grid-template-columns:1fr 1fr}
.btn{height:64px;border:2px solid var(--btn);border-radius:8px;background:var(--btn);color:var(--btn-ink);font:700 22px/1 "Poppins",system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.btn.alt{background:var(--btn2);color:var(--btn2-ink)}
.btn.pill{border-radius:999px}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.back:focus-visible,.lang button:focus-visible,.restart:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
.end{border-radius:14px;padding:22px 20px;margin-top:16px;color:#fff}
.end.go{background:var(--go)} .end.auto{background:var(--auto)} .end.stop{background:var(--stop)}
.end p{margin:0;font:700 clamp(22px,6vw,28px)/1.22 "Poppins",system-ui,sans-serif}
.end small{display:block;margin-top:8px;font:700 16px/1.35 "Poppins",system-ui,sans-serif;opacity:.92}
.restart{background:none;border:0;color:var(--muted);font:700 16px/1 "Poppins",system-ui,sans-serif;padding:10px 14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
@media (min-height:760px){.prompt{margin-top:26px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="back" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span id="backLabel">Back</span>
    </button>
    <div class="title" id="title">ATK quick start</div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </header>
  <main class="screen" id="screen" aria-live="polite"></main>
</div>

let lang="en";
try{const s=localStorage.getItem("atk-lang");if(s==="en"||s==="es")lang=s;else if((navigator.language||"").toLowerCase().startsWith("es"))lang="es";}catch(e){}
let trail=[1];
const cur=()=>trail[trail.length-1];
const $=id=>document.getElementById(id);

function go(n){if(!n)return;trail.push(n);render(true);}
function back(){if(trail.length>1){trail.pop();render(true);}}
function restart(){trail=[1];render(true);}
function setLang(l){lang=l;try{localStorage.setItem("atk-lang",l)}catch(e){}render(false);}

function el(tag,attrs={},kids=[]){const e=document.createElement(tag);for(const k in attrs){if(k==="text")e.textContent=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}kids.forEach(c=>c&&e.appendChild(c));return e;}

function render(anim){
  const t=UI[lang], n=cur(), st=STEPS[n], sc=SCREENS[st.s], text=st[lang]||sc[lang];
  document.documentElement.lang=lang;
  document.title=t.title;
  $("title").textContent=t.title;
  $("backLabel").textContent=t.back;
  $("back").disabled=trail.length<=1;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));

  const root=$("screen"); root.innerHTML="";
  root.className="screen"+(anim?" fade":"")+((sc.type==="q"||sc.type==="c")?" decision":"");
  const fig=el("div",{class:"figure"},[
    el("img",{src:IMGS[sc.img],alt:text,width:"1200",height:"646"})
  ]);
  fig.setAttribute("role","button");fig.setAttribute("tabindex","0");fig.setAttribute("aria-label",t.enlarge);
  fig.addEventListener("click",()=>zoom(IMGS[sc.img],text));
  fig.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();zoom(IMGS[sc.img],text);}});
  root.appendChild(fig);

  if(sc.type==="go"||sc.type==="auto"||sc.type==="stop"){
    const kids=[el("p",{text})];
    if(sc.type==="stop")kids.push(el("small",{text:t.stop.replace(/\.$/,"")+" ("+t.step.toLowerCase()+" "+trail[trail.length-2]+")."}));
    root.appendChild(el("div",{class:"end "+sc.type},kids));
    root.appendChild(el("div",{class:"spacer"}));
    root.appendChild(el("div",{class:"actions"},[el("button",{class:"btn pill",type:"button",text:t.restart,onclick:restart})]));
    root.appendChild(el("div",{class:"foot"},[el("span",{class:"stepno",text:t.step+" "+n})]));
  }else{
    root.appendChild(el("p",{class:"prompt",text}));
    root.appendChild(el("div",{class:"spacer"}));
    let acts;
    if(sc.type==="q"){
      acts=el("div",{class:"actions two"},[
        el("button",{class:"btn",type:"button",text:t.yes,onclick:()=>go(st.y)}),
        el("button",{class:"btn alt",type:"button",text:t.no,onclick:()=>go(st.n)})]);
    }else if(sc.type==="c"){
      acts=el("div",{class:"actions two"},[
        el("button",{class:"btn",type:"button",text:t.manual,onclick:()=>go(st.y)}),
        el("button",{class:"btn",type:"button",text:t.auto,onclick:()=>go(st.n)})]);
    }else{
      acts=el("div",{class:"actions"},[el("button",{class:"btn pill",type:"button",text:t.next,onclick:()=>go(st.y)})]);
    }
    root.appendChild(acts);
    root.appendChild(el("div",{class:"foot"},[el("span",{class:"stepno",text:t.step+" "+n}),n!==1?el("button",{class:"restart",type:"button",text:t.restart,onclick:restart}):null]));
  }
  if(anim)window.scrollTo(0,0);
}
function zoom(src,alt){
  const z=el("div",{class:"zoom",role:"dialog","aria-label":alt},[el("img",{src,alt}),el("span",{text:UI[lang].close})]);
  const close=()=>{z.remove();document.removeEventListener("keydown",esc);};
  const esc=e=>{if(e.key==="Escape")close();};
  z.addEventListener("click",close);document.addEventListener("keydown",esc);
  document.body.appendChild(z);
}
$("back").addEventListener("click",back);
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
render(false);
</script>
</body>
